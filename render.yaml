services:
  - type: web
    name: restora-backend
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        value: supersecretjwtkey_replace_in_production
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        value: "*"
